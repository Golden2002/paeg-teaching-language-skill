[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paeg-teaching-language"
version = "1.0.0"
description = "中文教学物料语言规范检查与修复工具（依据 GB/T 15834—2011、GB/T 15835—2011）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Golden Lee", email = "1293869083@qq.com" }]
keywords = ["teaching", "chinese", "language-standard", "education", "paeg", "lint"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Natural Language :: Chinese (Simplified)",
]

[project.urls]
Homepage = "https://github.com/Golden2002/paeg-teaching-language-skill"

[project.scripts]
paeg-teaching-language = "paeg_teaching_language.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paeg_teaching_language = ["data/*.json"]
